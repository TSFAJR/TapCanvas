name: Basic deployment images
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: basic-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ops/aliyun-basic/check.sh
      - run: node --test apps/hono-api/scripts/baseline-repair-sql.test.mjs apps/hono-api/scripts/migrate-deploy.test.mjs
  image:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: api
            file: apps/hono-api/Dockerfile.prod
            context: .
          - name: agents-bridge
            file: apps/hono-api/Dockerfile.bridge.prod
            context: .
          - name: new-api
            file: apps/new-api/Dockerfile
            context: apps/new-api
          - name: web
            file: apps/web/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.name == 'web'
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        if: matrix.name == 'web'
        with:
          node-version: '22.19.0'
      - name: Build and test web
        if: matrix.name == 'web'
        env:
          VITE_API_BASE: /api
          VITE_GITHUB_CLIENT_ID: ''
          VITE_GITHUB_REDIRECT_URI: ''
          VITE_OBJECT_STORAGE_PROVIDER: tos
          VITE_TOS_PUBLIC_BASE_URL: https://tanvas-ai.tos-cn-guangzhou.volces.com
          VITE_R2_PUBLIC_BASE_URL: https://assets.tapcanvas.uk
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          pnpm install --frozen-lockfile --filter @tapcanvas/web...
          pnpm --filter @tapcanvas/web test
          pnpm --filter @tapcanvas/web build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: coordinates
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/tap-canvas-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.coordinates.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            APT_MIRROR=deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple
            GO_PROXY=https://proxy.golang.org,direct
            VITE_ALLOW_BASIC_WITHOUT_MODELS=true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > '${{ matrix.name }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ matrix.name }}.txt
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Write deployment manifest
        run: |
          printf 'TAPCANVAS_API_IMAGE=%s\n' "$(cat api.txt)" > images.env
          printf 'TAPCANVAS_AGENTS_BRIDGE_IMAGE=%s\n' "$(cat agents-bridge.txt)" >> images.env
          printf 'NEW_API_IMAGE=%s\n' "$(cat new-api.txt)" >> images.env
          printf 'TAPCANVAS_WEB_IMAGE=%s\n' "$(cat web.txt)" >> images.env
          printf 'SOURCE_COMMIT=%s\n' '${{ github.sha }}' >> images.env
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: images.env
