name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: /api
      VITE_OBJECT_STORAGE_PROVIDER: tos
      VITE_TOS_PUBLIC_BASE_URL: https://tanvas-ai.tos-cn-guangzhou.volces.com
      VITE_R2_PUBLIC_BASE_URL: https://assets.tapcanvas.uk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tapcanvas/web...

      - name: Run guards and core tests
        run: pnpm --filter @tapcanvas/web test

      - name: Build web app
        run: pnpm --filter @tapcanvas/web build
